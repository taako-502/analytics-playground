services:
  source:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: source
    ports: ["15432:5432"]
    volumes:
      - source-data:/var/lib/postgresql/data
      - ./sql/source.sql:/docker-entrypoint-initdb.d/01-source.sql:ro
  analytics:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: playground
      POSTGRES_DB: analytics
    ports: ["15433:5432"]
    volumes:
      - analytics-data:/var/lib/postgresql/data
      - ./sql/analytics.sql:/docker-entrypoint-initdb.d/01-analytics.sql:ro
  metabase:
    image: metabase/metabase:latest
    ports: ["3000:3000"]
    volumes: ["metabase-data:/metabase-data"]
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
volumes:
  source-data:
  analytics-data:
  metabase-data:
