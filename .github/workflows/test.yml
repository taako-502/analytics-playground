name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go test ./...
      - run: docker compose up --build -d source analytics app
      - run: go test -tags=integration ./tests -run ^TestPipeline$ -v -timeout 10m
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
  metabase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: docker compose up -d analytics metabase
      - run: go test -tags=integration ./tests -run ^TestMetabase$ -v -timeout 10m
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down -v
